<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simple budget tracker built with vanilla JavaScript" />
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="budget-card" aria-labelledby="page-title">
        <header class="card-header">
          <p class="eyebrow">Exercise 03 · JavaScript</p>
          <h1 id="page-title">Budget Tracker</h1>
          <p class="subtitle">Add your expenses and keep track of the total amount spent.</p>
        </header>

        <form id="expense-form" class="expense-form" novalidate>
          <div class="field-group">
            <label for="expense-name">Expense name</label>
            <input
              id="expense-name"
              name="expense-name"
              type="text"
              autocomplete="off"
              placeholder="e.g. Groceries"
            />
          </div>

          <div class="field-group">
            <label for="expense-amount">Amount (€)</label>
            <input
              id="expense-amount"
              name="expense-amount"
              type="number"
              min="0.01"
              step="0.01"
              inputmode="decimal"
              placeholder="0.00"
            />
          </div>

          <button class="primary-button" type="submit">Add expense</button>
          <p id="form-error" class="form-error" role="alert" aria-live="polite"></p>
        </form>

        <section class="summary" aria-label="Expense summary">
          <span>Total spent</span>
          <strong id="total">€0.00</strong>
        </section>

        <section class="expenses-section" aria-labelledby="expenses-title">
          <div class="section-heading">
            <h2 id="expenses-title">Expenses</h2>
            <span id="expense-count" class="expense-count">0 items</span>
          </div>

          <p id="empty-state" class="empty-state">No expenses added yet.</p>
          <ul id="expense-list" class="expense-list" aria-live="polite"></ul>
        </section>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
